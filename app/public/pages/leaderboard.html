<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard</title>
  <link rel="stylesheet" href="../css/index.css" />
  <link rel="stylesheet" href="../css/leaderboard.css" />
</head>
<body>
  <div class="container">
    <h1>Leaderboard</h1>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Index</title>
  <link rel="stylesheet" href="../css/navbar.css" />
</head>
<body>
	<!-- Navigation Bar -->
	<nav class="navbar">
		<div class="navbar-container">
			<a href="home.html" class="navbar-brand">OneUp</a>
			<button class="navbar-toggle" aria-label="Toggle navigation">☰</button>
			<ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="challenges.html">Challenges</a></li>
        <li><a href="statistics.html">Statistics</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="leaderboard.html" class="active">Leaderboard</a></li>
        <li><a href="account-settings.html">Account Settings</a></li>
			</ul>
			<div class="navbar-actions">
				<div class="navbar-profile">
					<div class="navbar-profile-circle" id="navbarProfileCircle">
						<span id="navbarProfileInitial">U</span>
					</div>
					<div class="navbar-dropdown" id="navbarDropdown">
						<div class="navbar-dropdown-header">
							<div class="navbar-dropdown-username" id="navbarDropdownUsername">Loading...</div>
						</div>
						<ul class="navbar-dropdown-menu">
							<li class="navbar-dropdown-item">
								<a href="account-settings.html" class="navbar-dropdown-link">
									<span class="navbar-dropdown-icon">⚙️</span>
									<span>Account Settings</span>
								</a>
							</li>
							<li class="navbar-dropdown-divider"></li>
							<li class="navbar-dropdown-item">
								<a class="navbar-dropdown-link logout" onclick="logout()">
									<span class="navbar-dropdown-icon">🚪</span>
									<span>Logout</span>
								</a>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</nav>

    <div class="leaderboard-section">
      <div class="leaderboard-controls">
        <label for="sort-by-select" class="sort-label">Sort by:</label>
        <select id="sort-by-select" class="sort-select">
          <option value="total_points" selected>Total Points</option>
          <option value="challenges_completed">Challenges Completed</option>
          <option value="day_streak">Day Streak</option>
        </select>
      </div>
		<table class="leaderboard-table" id="leaderboard-table" aria-describedby="leaderboard-desc">
			<caption id="leaderboard-desc" style="caption-side: bottom; text-align: left; padding-top: 0.5rem; color: #666;">Top players</caption>
			<thead>
				<tr>
					<th class="rank">Rank</th>
					<th>Username</th>
                    <th>Total Points</th>
					<th>Challenges Completed</th>
                    <th>Day Streak</th>
                    <th>Last Active</th>
				</tr>
			</thead>
			<tbody id="leaderboard-body">
			</tbody>
		</table>
		<script>
		</script>
	</div>

  </div>

	<script src="../js/navbar.js"></script>
    <script src="../js/leaderboard.js"></script>
</body>
</html>
